name: Sync Notion

on:
  schedule:
    # 14:00 UTC is 10am Eastern in summer and 9am in winter.
    # GitHub cron has no daylight-saving awareness, so it drifts by an hour.
    - cron: "0 14 * * *"
  workflow_dispatch:

concurrency:
  group: sync-notion
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Pull from Notion
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          NOTION_DB_BOOKS: ${{ secrets.NOTION_DB_BOOKS }}
          NOTION_DB_POSTS: ${{ secrets.NOTION_DB_POSTS }}
          NOTION_DB_PROJECTS: ${{ secrets.NOTION_DB_PROJECTS }}
          NOTION_DB_RESUMES: ${{ secrets.NOTION_DB_RESUMES }}
          NOTION_DB_MARVEL_MOVIES: ${{ secrets.NOTION_DB_MARVEL_MOVIES }}
        run: npm run sync

      - name: Verify the site still builds
        run: npm run build

      - name: Commit and push
        id: commit
        run: |
          git config user.name "notion-sync"
          git config user.email "notion-sync@users.noreply.github.com"
          git add content src/assets/img/notion
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing changed in Notion."
            exit 0
          fi
          git commit -m "content: sync from Notion"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Surfaces the Netlify result here, so one GitHub notification covers the
      # whole chain and you never have to open the Netlify dashboard.
      - name: Wait for the Netlify deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
        run: node scripts/wait-for-netlify.js
